[project]
name = "ac-python-and-git-101"
version = "0.1.0"
description = "Day 1 of the Atlas Copco Python training: development environment, programming fundamentals and version control."
requires-python = ">=3.13"
dependencies = [
    "ipykernel",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
# These scripts are broken on purpose (exercise 07).
extend-exclude = ["exercises/python/07-files-and-exceptions/broken_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Starter files contain imports and loops that learners complete.
"exercises/python/**" = ["F401", "B007", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
